# dsh-bg-changer profile patch: exactly one loader row for this package.
#
# A third-party plugin registers through `insert` only. The package's
# `dsh.bundle.patch` manifest field turns this file into a profile layer, and
# the package name must appear in `dsh.profile.bundles` exactly once — either
# appended by `dsh plugin --profile <profile> add <spec>` or by
# `node tools/install.cjs`. Listing it twice creates duplicate loader entries
# and fails boot.
- insert:
    - id: bg-changer
      name: dsh-bg-changer
